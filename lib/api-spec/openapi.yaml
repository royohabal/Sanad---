openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public worker tipping information
  - name: tips
    description: Tip checkout and payment status
  - name: worker
    description: Worker earnings and account data
  - name: company
    description: Company management and payout records
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/workers/{slug}:
    get:
      operationId: getPublicWorker
      tags: [public]
      summary: Get a worker profile for a QR tipping page
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Worker profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicWorker" }
        "404":
          description: Worker not found
  /public/worker-photos/{photoId}:
    get:
      operationId: getPublicWorkerPhoto
      tags: [public]
      summary: Retrieve a worker's current public profile photo
      parameters:
        - name: photoId
          in: path
          required: true
          schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" }
      responses:
        "200":
          description: Worker profile photo
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: Photo not found
  /tips/quote:
    post:
      operationId: createTipQuote
      tags: [tips]
      summary: Create a short-lived KWD-to-USD tip quote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TipQuoteInput" }
      responses:
        "200":
          description: Currency conversion quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TipQuote" }
        "400":
          description: Invalid tip quote request
        "502":
          description: Exchange-rate service unavailable
  /tips/simulate:
    post:
      operationId: simulateTip
      tags: [tips]
      summary: Save a clearly labelled simulated tip for a demo worker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TipSimulationInput" }
      responses:
        "200":
          description: Previously saved simulated tip returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TipSimulationResponse" }
        "201":
          description: Simulated tip saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TipSimulationResponse" }
        "400":
          description: Invalid amount, rating, or request identifier
        "404":
          description: Demo worker not found
        "409":
          description: Request identifier was already used for different tip data
  /tips/checkout:
    post:
      operationId: createTipCheckout
      tags: [tips]
      summary: Start a tip checkout or clearly labelled development demo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TipCheckoutInput" }
      responses:
        "200":
          description: Checkout started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TipCheckoutResponse" }
        "400":
          description: Invalid tip
        "503":
          description: Payments are not configured
  /tips/{tipId}:
    get:
      operationId: getTipStatus
      tags: [tips]
      summary: Read verified payment status for a tip
      parameters:
        - name: tipId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tip status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TipPaymentStatus" }
        "404":
          description: Tip not found
  /worker/auth/login:
    post:
      operationId: workerLogin
      tags: [worker]
      summary: Sign in a worker with a phone number and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerLoginInput" }
      responses:
        "200":
          description: Worker sign-in status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerAuthStatus" }
        "401":
          description: Phone number or password is incorrect
        "429":
          description: Too many sign-in attempts
  /worker/auth/session:
    get:
      operationId: getWorkerAuthSession
      tags: [worker]
      summary: Check the current worker session
      responses:
        "200":
          description: Worker session status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerAuthStatus" }
  /worker/auth/password:
    post:
      operationId: changeWorkerPassword
      tags: [worker]
      security: [{ workerSession: [] }]
      summary: Change or set a worker password
      description: First sign-in password setup omits currentPassword; an active worker session must provide it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerPasswordInput" }
      responses:
        "200":
          description: Worker password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerAuthStatus" }
        "401":
          description: Password setup session required
  /worker/auth/logout:
    post:
      operationId: workerLogout
      tags: [worker]
      security: [{ workerSession: [] }]
      summary: End the current worker session
      responses:
        "200":
          description: Worker signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerSignoutResult" }
  /worker/profile/photo:
    post:
      operationId: uploadWorkerProfilePhoto
      tags: [worker]
      security: [{ clerkSession: [] }, { workerSession: [] }]
      summary: Upload or replace the signed-in worker's own profile photo
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { $ref: "#/components/schemas/WorkerPhotoUpload" }
          image/png:
            schema: { $ref: "#/components/schemas/WorkerPhotoUpload" }
          image/webp:
            schema: { $ref: "#/components/schemas/WorkerPhotoUpload" }
      responses:
        "200":
          description: Worker photo saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPhotoResponse" }
        "401":
          description: Authentication required
        "413":
          description: Photo exceeds the 5 MB limit
        "415":
          description: Unsupported or invalid image
  /worker/dashboard:
    get:
      operationId: getWorkerDashboard
      tags: [worker]
      security: [{ clerkSession: [] }, { workerSession: [] }]
      summary: Get the signed-in worker's earnings summary
      responses:
        "200":
          description: Worker dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerDashboard" }
        "401":
          description: Authentication required
  /worker/transactions:
    get:
      operationId: listWorkerTransactions
      tags: [worker]
      security: [{ clerkSession: [] }, { workerSession: [] }]
      summary: List the signed-in worker's tips
      responses:
        "200":
          description: Worker tips
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TipTransaction" }
        "401":
          description: Authentication required
  /worker/payouts:
    get:
      operationId: listWorkerPayouts
      tags: [worker]
      security: [{ clerkSession: [] }, { workerSession: [] }]
      summary: List the signed-in worker's payroll payout records
      responses:
        "200":
          description: Worker payout records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PayoutRecord" }
        "401":
          description: Authentication required
  /worker/badge:
    get:
      operationId: getWorkerBadge
      tags: [worker]
      security: [{ clerkSession: [] }, { workerSession: [] }]
      summary: Get the worker's QR badge details
      responses:
        "200":
          description: Worker QR badge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerBadge" }
        "401":
          description: Authentication required
  /company/profile:
    post:
      operationId: createCompanyProfile
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Register a company for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyProfileInput" }
      responses:
        "201":
          description: Company profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyProfile" }
        "401":
          description: Authentication required
  /company/dashboard:
    get:
      operationId: getCompanyDashboard
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Get company-wide tips and payout summary
      responses:
        "200":
          description: Company dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyDashboard" }
        "401":
          description: Authentication required
  /company/workers:
    get:
      operationId: listCompanyWorkers
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: List workers in the signed-in company
      responses:
        "200":
          description: Company workers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Worker" }
        "401":
          description: Authentication required
    post:
      operationId: createCompanyWorker
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Add a worker to the signed-in company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerInput" }
      responses:
        "201":
          description: Worker created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerCreated" }
        "401":
          description: Authentication required
  /company/workers/{workerId}/temporary-password:
    post:
      operationId: issueWorkerTemporaryPassword
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Issue a new one-time worker password
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Temporary password issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPasswordResponse" }
        "401":
          description: Authentication required
  /company/workers/{workerId}/photo:
    post:
      operationId: uploadCompanyWorkerPhoto
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Upload or replace a worker photo in the signed-in company
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { $ref: "#/components/schemas/WorkerPhotoUpload" }
          image/png:
            schema: { $ref: "#/components/schemas/WorkerPhotoUpload" }
          image/webp:
            schema: { $ref: "#/components/schemas/WorkerPhotoUpload" }
      responses:
        "200":
          description: Worker photo saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerPhotoResponse" }
        "401":
          description: Authentication required
        "404":
          description: Worker not found in the signed-in company
        "413":
          description: Photo exceeds the 5 MB limit
        "415":
          description: Unsupported or invalid image
  /company/workers/{workerId}:
    patch:
      operationId: updateCompanyWorker
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Update or deactivate a company worker
      parameters:
        - name: workerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerUpdate" }
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "401":
          description: Authentication required
        "404":
          description: Worker not found
  /company/demo-setup:
    post:
      operationId: setupCompanyDemo
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Explicitly add an insert-only demo team to an empty company workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyDemoSetupRequest" }
      responses:
        "200":
          description: Demo team created or existing demo team reused without duplicates
          content:
            application/json:
              schema:
                type: object
                required: [workerCount, alreadyConfigured]
                properties:
                  workerCount: { type: integer }
                  alreadyConfigured: { type: boolean }
        "400":
          description: Explicit confirmation required
        "401":
          description: Authentication required
        "403":
          description: Company administrator access required
        "404":
          description: Company not found
        "409":
          description: Real workers or a conflicting record prevent demo setup
        "503":
          description: Setup unavailable; insert-only operation is safe to retry
  /company/workers/{workerId}/demo-session:
    post:
      operationId: openCompanyDemoWorkerSession
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Open a 30-minute session for an active demo worker owned by this company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyDemoWorkerSessionRequest" }
      parameters:
        - in: path
          name: workerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: HttpOnly demo worker session cookie created; credentials are unchanged
          content:
            application/json:
              schema:
                type: object
                required: [isDemo]
                properties:
                  isDemo: { type: boolean, enum: [true] }
        "400":
          description: Same-origin JSON request required
        "401":
          description: Authentication required
        "403":
          description: Not an owned active demo worker
  /company/transactions:
    get:
      operationId: listCompanyTransactions
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: List company tip transactions
      responses:
        "200":
          description: Company transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TipTransaction" }
        "401":
          description: Authentication required
  /company/payouts:
    get:
      operationId: listCompanyPayouts
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: List company payout records
      responses:
        "200":
          description: Company payouts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PayoutRecord" }
        "401":
          description: Authentication required
    post:
      operationId: createCompanyPayout
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Record a payroll payout without claiming a bank transfer occurred
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutInput" }
      responses:
        "201":
          description: Payout record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRecord" }
        "401":
          description: Authentication required
  /company/payouts/{payoutId}:
    patch:
      operationId: updateCompanyPayoutStatus
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Mark a payroll payout record pending or recorded as paid
      parameters:
        - name: payoutId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutStatusInput" }
      responses:
        "200":
          description: Updated payout record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRecord" }
        "401":
          description: Authentication required
        "404":
          description: Payout not found
  /company/reports:
    get:
      operationId: getCompanyReport
      tags: [company]
      security: [{ clerkSession: [] }]
      summary: Get the selected monthly company report
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "200":
          description: Monthly report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyReport" }
        "401":
          description: Authentication required
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
    workerSession:
      type: apiKey
      in: cookie
      name: sanad_worker_session
  schemas:
    CompanyDemoSetupRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, enum: [true] }
    CompanyDemoWorkerSessionRequest:
      type: object
      additionalProperties: false
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicWorker:
      type: object
      required: [id, slug, name, companyName, role, isDemo]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        arabicName: { type: ["string", "null"] }
        companyName: { type: string }
        role: { type: string }
        branch: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"], format: uri }
        isDemo: { type: boolean }
    WorkerPhotoUpload:
      type: string
    WorkerPhotoResponse:
      type: object
      required: [photoUrl]
      properties:
        photoUrl: { type: string, format: uri }
    TipSimulationInput:
      type: object
      required: [workerSlug, amountFils, requestId]
      properties:
        workerSlug: { type: string, minLength: 1, maxLength: 180 }
        amountFils: { type: integer, minimum: 250, maximum: 100000 }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        requestId: { type: string, format: uuid }
    TipSimulationResponse:
      type: object
      required: [tipId, workerSlug, workerName, amountFils, currency, status, rating, isDemo]
      properties:
        tipId: { type: string, format: uuid }
        workerSlug: { type: string }
        workerName: { type: string }
        amountFils: { type: integer }
        currency: { type: string, enum: [KWD] }
        status: { type: string, enum: [demo] }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        isDemo: { type: boolean, enum: [true] }
    TipCheckoutInput:
      type: object
      required: [workerSlug, amountFils, quoteToken, requestId]
      properties:
        workerSlug: { type: string, minLength: 1 }
        amountFils: { type: integer, minimum: 250, maximum: 100000 }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        quoteToken: { type: string, minLength: 1 }
        requestId: { type: string, format: uuid }
    TipQuoteInput:
      type: object
      required: [workerSlug, amountFils]
      properties:
        workerSlug: { type: string, minLength: 1 }
        amountFils: { type: integer, minimum: 250, maximum: 100000 }
        rating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
    TipQuote:
      type: object
      required: [workerSlug, amountFils, currency, usdAmountCents, paymentCurrency, kwdToUsdRate, rateSource, rateUpdatedAt, quotedAt, expiresAt, quoteToken]
      properties:
        workerSlug: { type: string }
        amountFils: { type: integer }
        currency: { type: string, enum: [KWD] }
        usdAmountCents: { type: integer }
        paymentCurrency: { type: string, enum: [USD] }
        kwdToUsdRate: { type: string }
        rateSource: { type: string }
        rateUpdatedAt: { type: string, format: date-time }
        quotedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        quoteToken: { type: string }
    TipCheckoutResponse:
      type: object
      required: [tipId, paymentMode, status, message, amountFils, currency, usdAmountCents, paymentCurrency, kwdToUsdRate, rateSource, rateUpdatedAt]
      properties:
        tipId: { type: string }
        paymentMode: { type: string, enum: [demo, stripe, unavailable] }
        status: { type: string, enum: [demo, pending, unavailable] }
        checkoutUrl: { type: ["string", "null"], format: uri }
        message: { type: string }
        amountFils: { type: integer }
        currency: { type: string, enum: [KWD] }
        usdAmountCents: { type: integer }
        paymentCurrency: { type: string, enum: [USD] }
        kwdToUsdRate: { type: string }
        rateSource: { type: string }
        rateUpdatedAt: { type: string, format: date-time }
    TipPaymentStatus:
      type: object
      required: [tipId, status, amountFils, currency, isDemo]
      properties:
        tipId: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, cancelled, demo] }
        amountFils: { type: integer }
        currency: { type: string, enum: [KWD] }
        isDemo: { type: boolean }
        workerName: { type: string }
        companyName: { type: string }
        usdAmountCents: { type: integer }
        paymentCurrency: { type: string, enum: [USD] }
        kwdToUsdRate: { type: string }
        rateSource: { type: string }
        rateUpdatedAt: { type: string, format: date-time }
    TipTransaction:
      type: object
      required: [id, workerId, workerName, amountFils, currency, status, createdAt, isDemo]
      properties:
        id: { type: string }
        workerId: { type: string }
        workerName: { type: string }
        amountFils: { type: integer }
        currency: { type: string, enum: [KWD] }
        status: { type: string, enum: [pending, succeeded, failed, cancelled, demo] }
        rating: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        isDemo: { type: boolean }
    PayoutRecord:
      type: object
      required: [id, workerId, workerName, amountFils, month, status, recordedAt, isDemo]
      properties:
        id: { type: string }
        workerId: { type: string }
        workerName: { type: string }
        amountFils: { type: integer }
        month: { type: string }
        status: { type: string, enum: [pending, paid] }
        recordedAt: { type: string, format: date-time }
        note: { type: ["string", "null"] }
        isDemo: { type: boolean }
    Worker:
      type: object
      required: [id, slug, name, phoneNumber, role, branch, status, totalTipsFils, isDemo]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        arabicName: { type: ["string", "null"] }
        email: { type: ["string", "null"], format: email }
        phoneNumber: { type: ["string", "null"] }
        role: { type: string }
        branch: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"], format: uri }
        status: { type: string, enum: [active, inactive, invited] }
        totalTipsFils: { type: integer }
        isDemo: { type: boolean }
    WorkerCreated:
      type: object
      required: [worker, temporaryPassword]
      properties:
        worker: { $ref: "#/components/schemas/Worker" }
        temporaryPassword: { type: string }
    WorkerInput:
      type: object
      required: [name, phoneNumber, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        arabicName: { type: ["string", "null"], maxLength: 120 }
        phoneNumber: { type: string, minLength: 8, maxLength: 20 }
        role: { type: string, minLength: 1, maxLength: 120 }
        branch: { type: ["string", "null"], maxLength: 120 }
    WorkerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        arabicName: { type: ["string", "null"], maxLength: 120 }
        email: { type: ["string", "null"], format: email }
        role: { type: string, minLength: 1, maxLength: 120 }
        branch: { type: ["string", "null"], maxLength: 120 }
        status: { type: string, enum: [active, inactive, invited] }
    WorkerLoginInput:
      type: object
      required: [phoneNumber, password]
      properties:
        phoneNumber: { type: string, minLength: 8, maxLength: 20 }
        password: { type: string, minLength: 1, maxLength: 128 }
    WorkerPasswordInput:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    WorkerAuthStatus:
      type: object
      required: [authenticated, passwordChangeRequired, workerName]
      properties:
        authenticated: { type: boolean }
        passwordChangeRequired: { type: boolean }
        workerName: { type: ["string", "null"] }
    WorkerSignoutResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    TemporaryPasswordResponse:
      type: object
      required: [temporaryPassword]
      properties:
